highlight_achievements:
  - "Cut extraction time for a 2-million-row Oracle dataset from 2 hours to 3 minutes (40x) and improved pipeline SLA compliance by redesigning it with configurable JDBC partitioning for parallel data retrieval."
  - "Cut warehouse query runtime by 30-50% on Redshift, Oracle, MySQL, and SQL Server workloads through advanced SQL, stored procedures, and execution-plan tuning."
  - "Delivered 10-20 curated, analytics-ready datasets (1-5M rows/batch) using PySpark on AWS EMR, Databricks, Delta Lake, AWS Glue, and Redshift, maintaining data consistency across 27 enterprise applications."
  - "Saved 10-15 hours of manual work per week by automating ingestion and ETL workflows with AWS Lambda, Step Functions, Glue jobs, and a configuration-driven JDBC hydration framework."
  - "Improved pipeline reliability and cut manual intervention by 20% by orchestrating ETL workflows in Apache Airflow with retry logic, alerting, and CloudFormation/Jenkins CI/CD (cutting release time from 90 to 30 mins)."

autonomy_settings:
  llm_provider: "gemini"
  scoring_model: "gemini-2.5-flash"
  tailoring_model: "gemini-2.5-pro"
  auto_apply_min_score: 80          # Semi-autonomous: >= 80% auto-applies
  review_queue_min_score: 60        # 60-79% queued for user review
  require_hr_outreach_approval: false # Auto-send cold emails on scheduled runs without asking for approval
  deduplicate_hr_emails: true       # NEVER repeat or re-send to any HR email ID already contacted
  max_daily_applications: 25
  max_daily_hr_outreach_drafts: 30

